<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudo - React</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="quiz-container">
    <header class="quiz-header">
      <span id="question-count">Pergunta 1 de 30</span>
      <button id="restart-btn" class="secondary-btn">Reiniciar</button>
    </header>

    <section id="quiz-body" class="quiz-body">
      <h2 id="question-title" class="question-title">Carregando pergunta...</h2>
      
      <div id="options-container" class="options-container">
      </div>

      <div id="explanation-box" class="explanation-box hidden">
        <h3>💡 Explicação:</h3>
        <p id="explanation-text"></p>
        <button id="next-btn" class="primary-btn">Próxima Pergunta</button>
      </div>
    </section>

    <section id="result-screen" class="result-screen hidden">
      <h2>🎉 Quiz Concluído!</h2>
      <p id="final-score" class="score-text"></p>
      
      <div id="study-recommendation" class="recommendation-box">
      </div>

      <button id="restart-quiz-btn" class="primary-btn">Tentar Novamente</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
