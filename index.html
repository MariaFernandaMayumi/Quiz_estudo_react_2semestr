<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos - ADS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="quiz-container">
    <main id="quiz-screen">
      <header>
        <div id="progress">Pergunta <span id="current-question">1</span> de <span id="total-questions">0</span></div>
        <h1 id="question-text">Carregando pergunta...</h1>
      </header>

      <div id="options-container" class="options-list"></div>

      <div id="explanation-box" class="explanation hidden">
        <h3>Explicação:</h3>
        <p id="explanation-text"></p>
      </div>
      <div class="acoes-quiz">
  <button id="reset-in-quiz-btn" class="btn btn-secondary">Reiniciar</button>
  <button id="next-btn" class="btn">Próxima Pergunta</button>
</div>
     
    </main>

    <div id="result-screen" class="hidden">
      <h2>Quiz Concluído! </h2>
      <p>Sua pontuação final foi: <strong id="score">0</strong> de <strong id="score-total">0</strong>.</p>
      <button id="restart-btn" class="btn">Refazer Quiz</button>
    </div>
  </div>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link active">Quiz</a>
    <a href="blogestudo.html" class="nav-link">Conteúdo e Vídeos</a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
