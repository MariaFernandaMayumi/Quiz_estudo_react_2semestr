<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos - ADS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="quiz-screen">
  <div class="quiz-header">
    <span class="question-count">Pergunta <span id="current-question">1</span> de <span id="total-questions">15</span></span>
  </div>

  <h2 id="question-text">Carregando pergunta...</h2>

  <div id="options-container" class="options-grid"></div>
  <div id="explanation-box" class="hidden">
    <p id="explanation-text"></p>
    <button id="next-btn" class="btn primary-btn hidden">Próxima Pergunta</button>
  </div>
  <div class="quiz-footer">
    <button id="reset-in-quiz-btn" class="btn secondary-btn">Reiniciar Quiz</button>
  </div>
</div>
     
    </main>

    <div id="result-screen" class="hidden">
      <h2>Quiz Concluído! </h2>
      <p>Sua pontuação final foi: <strong id="score">0</strong> de <strong id="score-total">0</strong>.</p>
      <button id="restart-btn" class="btn">Refazer Quiz</button>
    </div>
  </div>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link active">Quiz</a>
    <a href="blogestudo.html" class="nav-link">Conteúdo e Vídeos</a>
  </nav>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
