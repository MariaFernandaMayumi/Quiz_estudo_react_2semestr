<!DOCTYPE html>

<head>

  <title>Quiz de Estudo de BD</title>
  <H1>O banco de dados não nasce com o computador, nasce da necessidade humana de registrar, guardar e recuperar informações. 
</H1>
  <link rel="stylesheet" href="style.css">
</head>
<body>

 <div class="quiz-card">

  <nav class="nav-switcher">
  <a href="index.html" class="nav-tab active">Quiz</a>
  <a href="blogestudo.html" class="nav-tab">Conteúdo e Vídeos</a>
</nav>

  <div id="quiz-screen">
    <div class="quiz-header">
      <p class="progress-info">
        Pergunta <span id="current-question">1</span> de <span id="total-questions">30</span>
      </p>
      <button id="reset-in-quiz-btn" class="btn-text">Reiniciar</button>
    </div>

    <h2 id="question-text" class="question-title"></h2>

    <div id="options-container" class="options-list"></div>

    <div id="explanation-box" class="explanation-box hidden">
      <h3>Explicação:</h3>
      <p id="explanation-text"></p>
    </div>

    <div class="action-container">
      <button id="next-btn" class="btn-primary hidden" disabled>Próxima Pergunta</button>
    </div>
  </div>

</div>
        <button id="next-btn" class="btn-primary hidden" disabled>Próxima Pergunta</button>
      </div>
    </div>
    <div id="result-screen" class="hidden">
      <h2>Resultado Final</h2>
      <p class="result-score">
        Você acertou <span id="score">0</span> de <span id="score-total">0</span> perguntas!
      </p>
      <button id="restart-btn" class="btn-primary">Reiniciar Quiz</button>
    </div>

  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
